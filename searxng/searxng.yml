# SearxNG settings for ask-search.
# Merged on top of SearxNG's defaults (use_default_settings).
# The secret key is NOT set here: SearxNG reads it from the SEARXNG_SECRET env var.
use_default_settings: true

general:
  debug: false
  instance_name: "ask-search SearxNG"

search:
  # ask-search needs JSON output
  formats:
    - html
    - json

server:
  bind_address: "0.0.0.0"
  port: 8080

ui:
  static_use_hash: true
  default_theme: simple

engines:
  - name: google
    engine: google
    shortcut: google

  - name: duckduckgo
    engine: duckduckgo
    shortcut: ddg

  - name: brave
    engine: brave
    shortcut: brave
